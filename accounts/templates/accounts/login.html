```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        تسجيل الدخول
    </title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f6f9;
        }

        .login-box {
            width: 360px;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #417690;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            background: #f8d7da;

            color: #842029;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>
        تسجيل الدخول
    </h1>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}

        <label for="username">
            اسم المستخدم
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
            autocomplete="username"
        >


        <label for="password">
            كلمة المرور
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
        >


        <button type="submit">
            تسجيل الدخول
        </button>

    </form>

</div>

</body>

</html>
```
